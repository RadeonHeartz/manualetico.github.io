<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manual Ético: autoevaluación y casos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F7F5F3; --surface:#FFFFFF; --ink:#17141F; --muted:#5B5768; --line:#DDD8D0;
  --blue:#4470FF; --accent:#2F55B8; --on-accent:#FFFFFF; --blue-soft:#E9EEFF;
  --ok-bg:#E4F0D6; --ok-ink:#274A18; --ok-line:#7FAE5C;
  --mid-bg:#FFEDCC; --mid-ink:#6B4200; --mid-line:#E0A23A;
  --no-bg:#FFE0D6; --no-ink:#7C2810; --no-line:#E27A5A;
  --s1-bg:#F4B4B4; --s1-line:#E64545;
  --s2-bg:#FADAB8; --s2-line:#F0951A;
  --s3-bg:#FFFBCC; --s3-line:#D9C400;
  --s4-bg:#CDF5C4; --s4-line:#3DBE2B;
  --display:"DM Serif Display",Georgia,"Times New Roman",serif;
  --body:"Sora",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141219; --surface:#1F1B29; --ink:#F3EFE8; --muted:#B4AEC2; --line:#39344A;
    --blue:#8CA5FF; --accent:#9DB2FF; --on-accent:#0F1226; --blue-soft:#232845;
    --ok-bg:#22321B; --ok-ink:#CDE8B4; --ok-line:#5C8A3D;
    --mid-bg:#3A2D14; --mid-ink:#FFDDA6; --mid-line:#B4812E;
    --no-bg:#3B221B; --no-ink:#FFC6B4; --no-line:#B45D42;
    --s1-bg:#4A2427; --s1-line:#C24040;
    --s2-bg:#4A3520; --s2-line:#C9821E;
    --s3-bg:#47431A; --s3-line:#B3A200;
    --s4-bg:#1F4222; --s4-line:#3A9E2B;
  }
}
:root[data-theme="dark"]{
  --bg:#141219; --surface:#1F1B29; --ink:#F3EFE8; --muted:#B4AEC2; --line:#39344A;
  --blue:#8CA5FF; --accent:#9DB2FF; --on-accent:#0F1226; --blue-soft:#232845;
  --ok-bg:#22321B; --ok-ink:#CDE8B4; --ok-line:#5C8A3D;
  --mid-bg:#3A2D14; --mid-ink:#FFDDA6; --mid-line:#B4812E;
  --no-bg:#3B221B; --no-ink:#FFC6B4; --no-line:#B45D42;
  --s1-bg:#4A2427; --s1-line:#C24040;
  --s2-bg:#4A3520; --s2-line:#C9821E;
  --s3-bg:#47431A; --s3-line:#B3A200;
  --s4-bg:#1F4222; --s4-line:#3A9E2B;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:6px}
[tabindex="-1"]:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Masthead */
.mast{padding:28px 0 8px}
.strip{display:flex;gap:6px;align-items:center;justify-content:space-between}
.strip .b{flex:1 1 0;max-width:84px;min-width:0}
.strip svg{display:block;width:100%;height:auto}
.mast-title{font-family:var(--display);font-size:clamp(1.5rem,5vw,2rem);line-height:1.1;margin:22px 0 2px}
.mast-sub{margin:0;color:var(--muted);font-size:.9rem}

/* Nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-top:18px}
.nav .wrap{display:flex;gap:8px;padding-top:10px;padding-bottom:10px;overflow-x:auto}
.tab{flex:none;border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:8px 16px;font-weight:600;font-size:.9rem;cursor:pointer;white-space:nowrap}
.tab:hover{border-color:var(--blue)}
.tab[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tab .done{margin-left:6px}

main{padding:32px 0 56px;scroll-margin-top:72px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(2.4rem,9vw,3.6rem);line-height:1.03;letter-spacing:-.015em;margin:0 0 16px}
h2{font-family:var(--display);font-weight:400;font-size:clamp(1.5rem,5.5vw,1.9rem);line-height:1.2;margin:0 0 18px;letter-spacing:-.005em}
h3{font-size:1rem;margin:0 0 6px}
.lead{font-size:1.1rem;max-width:60ch;margin:0 0 22px}
.note{color:var(--muted);max-width:60ch}
.facts{list-style:none;margin:0 0 22px;padding:0;display:grid;gap:10px}
.facts li{border-left:4px solid var(--blue);padding:2px 0 2px 14px}

.btn{display:inline-block;border:0;background:var(--accent);color:var(--on-accent);font-weight:600;padding:14px 26px;border-radius:999px;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--blue);filter:none}
.row{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}

/* Progress + question head */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:6px}
.meta{margin:0;color:var(--muted);font-size:.9rem}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0 26px}
.bar span{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .3s}
.face{flex:none;width:68px}
.face svg{display:block;width:100%;height:auto}
.pop{animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.8) rotate(-6deg)}to{transform:scale(1) rotate(0)}}
@media (prefers-reduced-motion: reduce){.pop{animation:none}.bar span{transition:none}}

/* Options */
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:14px 16px;margin:0 0 10px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;cursor:pointer}
.opt:hover{border-color:var(--blue)}
.opt .mk{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:700;margin-top:1px}
.opt.locked{cursor:default}
.opt.locked:hover{border-color:var(--line)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok-ink)}
.opt.ok .mk{background:var(--ok-line);border-color:var(--ok-line);color:#fff}
.opt.mid{background:var(--mid-bg);border-color:var(--mid-line);color:var(--mid-ink)}
.opt.mid .mk{background:var(--mid-line);border-color:var(--mid-line);color:#fff}
.opt.no{background:var(--no-bg);border-color:var(--no-line);color:var(--no-ink)}
.opt.no .mk{background:var(--no-line);border-color:var(--no-line);color:#fff}
.opt.dim{opacity:.6}
.opt.stage{border-width:2px}
.opt.s1{background:var(--s1-bg);border-color:var(--s1-line)}
.opt.s2{background:var(--s2-bg);border-color:var(--s2-line)}
.opt.s3{background:var(--s3-bg);border-color:var(--s3-line)}
.opt.s4{background:var(--s4-bg);border-color:var(--s4-line)}
.opt.picked{outline:3px solid var(--ink);outline-offset:2px}

.fb{border-radius:16px;padding:16px 18px;margin:18px 0 0;border:1.5px solid}
.fb.ok{background:var(--ok-bg);color:var(--ok-ink);border-color:var(--ok-line)}
.fb.mid{background:var(--mid-bg);color:var(--mid-ink);border-color:var(--mid-line)}
.fb.no{background:var(--no-bg);color:var(--no-ink);border-color:var(--no-line)}
.fb p{margin:0 0 8px}
.fb p:last-child{margin-bottom:0}
.fb .ref{font-size:.85rem;opacity:.85}

/* Story */
.story{background:var(--surface);border:1.5px solid var(--line);border-left-width:8px;border-radius:14px;padding:18px 20px;margin:0 0 26px}
.story p{margin:0}
.recap{margin:0 0 20px;padding:12px 16px;border-radius:12px;background:var(--blue-soft);font-size:.95rem}

/* Results */
.score{display:flex;align-items:center;gap:20px;margin-bottom:24px}
.score .face{width:110px}
.score .n{font-family:var(--display);font-size:3rem;line-height:1;margin:0}
.topics{display:grid;gap:16px;margin:8px 0 28px}
.topic .t{display:flex;justify-content:space-between;gap:12px;font-size:.95rem;margin-bottom:6px}
.topic .t span:last-child{color:var(--muted);white-space:nowrap}
.topic .bar{margin:0;height:10px}
.topic .hint{font-size:.85rem;color:var(--muted);margin:6px 0 0}
details{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 16px;margin:0 0 12px}
summary{cursor:pointer;font-weight:600}
.miss{padding:12px 0;border-top:1px solid var(--line);margin-top:12px}
.miss p{margin:0 0 4px}
.chip{display:inline-block;font-size:.8rem;font-weight:600;padding:2px 10px;border-radius:99px;border:1.5px solid}
.chip.ok{background:var(--ok-bg);color:var(--ok-ink);border-color:var(--ok-line)}
.chip.mid{background:var(--mid-bg);color:var(--mid-ink);border-color:var(--mid-line)}
.chip.no{background:var(--no-bg);color:var(--no-ink);border-color:var(--no-line)}
.sumcase{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:16px 18px;margin:0 0 12px}
.sumcase p{margin:6px 0 0}
.sumcase h3{font-size:1.05rem}
textarea{width:100%;min-height:84px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;resize:vertical}
label.l{display:block;font-weight:600;margin:18px 0 6px}
.sep{border:0;border-top:1px solid var(--line);margin:34px 0}
.stagebox{margin-top:8px}
.foot{border-top:1px solid var(--line);padding:22px 0 30px;color:var(--muted);font-size:.85rem}
.foot p{margin:0}
@media (max-width:480px){
  .face{width:54px}
  .score .face{width:84px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div class="strip" id="strip" aria-hidden="true"></div>
    <p class="mast-title">Manual Ético</p>
    <p class="mast-sub">Para un futuro laboral mejor</p>
  </header>
</div>
<nav class="nav" aria-label="Secciones">
  <div class="wrap" id="tabs"></div>
</nav>
<div class="wrap">
  <main id="main"></main>
  <footer class="foot">
    <p>Basado en el Manual Ético de Carlos Andrés Arriaza Lara, páginas 3 a 10. Tus respuestas se quedan en esta página y no se envían a ningún lugar.</p>
  </footer>
</div>

<script>
/* ---------- utilidades ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const range = n => Array.from({length:n},(_,i)=>i);
const L = 'ABCD';

/* ---------- personajes (los "blobs" del manual) ---------- */
const COL = {lilac:'#CBB5E5',yellow:'#FFF080',pink:'#F1C4E6',salmon:'#FFA893',peach:'#FFD28F',green:'#BBD3A0',blue:'#B0C8EE',beige:'#EADCC6'};
const SHAPES = [
  'M50 6 C72 4 94 22 92 48 C90 74 70 94 46 92 C22 90 6 70 10 46 C14 22 30 8 50 6Z',
  'M30 10 C55 -2 90 12 94 42 C98 70 78 96 48 94 C20 92 2 74 8 46 C10 30 16 18 30 10Z',
  'M40 8 C64 6 88 20 90 44 C92 66 82 92 54 94 C28 96 8 80 8 56 C8 32 20 10 40 8Z',
  'M22 18 C44 2 84 6 92 36 C100 66 76 96 44 92 C16 88 -2 60 6 40 C8 32 14 24 22 18Z'
];
const MOUTH = {
  happy:'M36 60 Q50 76 64 60',
  neutral:'M38 65 L62 65',
  sad:'M38 71 Q50 57 62 71',
  worried:'M32 66 q9 -8 18 0 t18 0'
};
function blob(color, mood, shape=0, rot=0){
  return `<svg viewBox="0 0 100 100" aria-hidden="true" focusable="false" style="transform:rotate(${rot}deg)">
    <path d="${SHAPES[shape%SHAPES.length]}" fill="${COL[color]}"/>
    <circle cx="37" cy="45" r="3" fill="#17141F"/><circle cx="63" cy="45" r="3" fill="#17141F"/>
    <path d="${MOUTH[mood]}" fill="none" stroke="#17141F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}
const COVER = [['lilac','neutral',0,-8],['yellow','neutral',2,6],['pink','worried',1,-4],['salmon','neutral',3,8],['peach','happy',2,-6],['green','happy',1,4],['blue','happy',0,-10],['beige','sad',3,6]];
$('#strip').innerHTML = COVER.map(c => `<div class="b">${blob(...c)}</div>`).join('');

/* ---------- contenido: autoevaluación ---------- */
const TOPICS = {
  intro:{name:'Introducción a la ética',pages:'3 y 4'},
  para:{name:'Paradigmas',pages:'5'},
  cambio:{name:'Cambio de paradigmas y semáforo del consciente',pages:'6 y 7'},
  cultura:{name:'Grandes influenciadores de la cultura',pages:'8 y 9'},
  moral:{name:'Ética y moral',pages:'10'}
};
const STAGES = ['Inconsciente incorrecto','Consciente incorrecto','Consciente correcto','Inconsciente correcto'];
const QUIZ = [
  {t:'intro',p:4,q:'¿Qué examina la ética?',
   o:['El comportamiento humano, a partir de la libre elección','Únicamente las reglas escritas de cada empresa','Los resultados económicos de una organización','Las leyes que dicta el gobierno'],a:0,
   w:'La ética examina el comportamiento humano. Se fundamenta en la libre elección y ofrece elementos de juicio ante una situación determinada.'},
  {t:'intro',p:4,q:'Según el manual, ¿quién responde por los actos de una persona?',
   o:['Cada persona, porque es responsable de sus actos','La empresa donde trabaja','Su jefe directo','Nadie, todo depende de la situación'],a:0,
   w:'Cada persona es responsable de sus actos y debe responder por ellos. Por eso la ética se apoya en la libre elección.'},
  {t:'intro',p:3,q:'¿Cuál es el objetivo principal del manual?',
   o:['Concientizar sobre la ética para lograr un ambiente laboral ético','Sancionar a quienes incumplan las normas','Aumentar las ventas de la empresa','Explicar las leyes laborales vigentes'],a:0,
   w:'El manual busca concientizar a las personas, tanto empleadores como empleados, para construir un ambiente laboral ético que beneficie a la empresa y también a cada persona.'},
  {t:'para',p:5,q:'¿Qué es un paradigma?',
   o:['Un modelo mental que dicta la manera en que interpretamos las cosas','Una regla escrita que se firma al entrar a una empresa','Una sanción por una mala conducta','Una emoción pasajera'],a:0,
   w:'Un paradigma es un modelo mental, el marco de referencia con el que juzgamos las situaciones que experimentamos.'},
  {t:'para',p:5,q:'Frases como «Lo barato sale caro» o «No se puede tener todo en la vida» son ejemplos de…',
   o:['Paradigmas','Sanciones laborales','Leyes escritas','Emociones'],a:0,
   w:'Son creencias que funcionan como marco de referencia para interpretar la vida: paradigmas.'},
  {t:'para',p:5,q:'¿Qué le da poder a un paradigma?',
   o:['La creencia que hay en la mente','La cantidad de personas que lo repiten','El cargo de quien lo dice','Que esté escrito en un reglamento'],a:0,
   w:'Lo que le da poder al paradigma es la creencia que hay en la mente. Por eso cambiarlo empieza por cuestionar esa creencia.'},
  {t:'cambio',p:6,q:'¿Cuál es el orden correcto del camino para cambiar un paradigma?',
   o:['Inconsciente incorrecto → Consciente incorrecto → Consciente correcto → Inconsciente correcto','Consciente incorrecto → Inconsciente incorrecto → Inconsciente correcto → Consciente correcto','Inconsciente incorrecto → Consciente correcto → Consciente incorrecto → Inconsciente correcto','Consciente correcto → Inconsciente correcto → Consciente incorrecto → Inconsciente incorrecto'],a:0,
   w:'Se empieza sin saber que algo está mal, luego se toma conciencia, después se hace lo correcto con esfuerzo y, con la práctica, se hace lo correcto de manera natural.'},
  {t:'cambio',p:7,q:'Pedro sabe que su forma de trabajar perjudica a un compañero, pero sigue haciéndolo. ¿En qué etapa del semáforo está?',
   o:STAGES,a:1,keep:true,
   w:'Pedro está en «consciente incorrecto»: sabe que lo que hace está mal, pero continúa.'},
  {t:'cambio',p:7,q:'Marta antes llegaba tarde sin notar el efecto en su equipo. Ahora llega puntual, pero cada mañana se recuerda que debe hacerlo. ¿En qué etapa está?',
   o:STAGES,a:2,keep:true,
   w:'Marta está en «consciente correcto»: hace lo correcto, pero todavía necesita recordarse que debe hacerlo. Cuando lo haga sin recordárselo, llegará a «inconsciente correcto».'},
  {t:'cultura',p:8,q:'¿Qué influenciador de la cultura es la base de la sociedad y la primera relación que conoce el ser humano?',
   o:['La familia','El gobierno','La economía','El entretenimiento'],a:0,
   w:'A nivel familiar se transmiten valores, identidad, integridad y respeto.'},
  {t:'cultura',p:8,q:'¿Qué papel le da el manual a la educación como influenciadora de la cultura?',
   o:['Promover principios éticos y llevar a la sociedad a un cambio positivo','Emitir juicios de valor y enseñar sobre principios religiosos','Guiar a las personas a generar trabajo, visión y misión','Buscar que las personas se entretengan'],a:0,
   w:'La educación (intelectual, moral y cívica) debe promover principios éticos y llevar a la sociedad a un cambio positivo.'},
  {t:'cultura',p:9,q:'Según el manual, ¿qué deben cumplir las personas con altos cargos en el gobierno?',
   o:['Los requisitos éticos y académicos necesarios','El respaldo de un grupo político','Muchos años de antigüedad','Experiencia previa en el sector privado'],a:0,
   w:'Es importante que quienes ocupan altos cargos llenen los requisitos éticos y académicos necesarios.'},
  {t:'cultura',p:9,q:'¿Qué influenciador de la cultura buscamos porque nos gusta, es decir, por motivación interna?',
   o:['El entretenimiento','La educación','La comunicación','El gobierno'],a:0,
   w:'El ser humano busca el entretenimiento porque le gusta; su motivación es interna.'},
  {t:'cultura',p:9,q:'¿Qué advierte el manual sobre la influencia de los medios de comunicación?',
   o:['Es enorme y, lamentablemente, no toda es ética','Es mínima comparada con la de la familia','Siempre es ética si es legal','Solo afecta a las personas jóvenes'],a:0,
   w:'La influencia de la comunicación es enorme y no todos los mensajes son éticos, por eso conviene analizarlos con criterio.'},
  {t:'moral',p:10,q:'¿Cuál es la diferencia entre ética y moral?',
   o:['La ética es la reflexión teórica sobre lo correcto; la moral son las normas que guían nuestras acciones en la práctica','Son exactamente lo mismo','La ética son las normas del día a día y la moral es la reflexión teórica','La ética aplica solo a las empresas y la moral solo a la familia'],a:0,
   w:'La ética estudia la moral: es la parte teórica y reflexiva. La moral es la parte práctica y se manifiesta en las acciones y decisiones diarias.'},
  {t:'moral',p:10,q:'La moral se basa en…',
   o:['Valores, normas sociales y culturales, y costumbres y tradiciones','Únicamente teorías filosóficas','Solo en las leyes','La opinión del jefe'],a:0,
   w:'La moral se basa en valores (respeto, honestidad, responsabilidad), normas sociales y culturales, y costumbres y tradiciones. En resumen: la ética nos dice qué es lo correcto y por qué; la moral, cómo actuar en la vida real.'}
];

const TIPS = [
  'Es la etapa más difícil de notar. Pide a alguien de confianza que te cuente cómo ve tu forma de trabajar y revisa qué creencias (paradigmas) hay detrás de tu hábito.',
  'Ya diste el paso más difícil: darte cuenta. Ahora identifica qué creencia te hace seguir igual y elige una acción concreta y pequeña para esta semana.',
  'Vas por buen camino. Recuérdate para qué lo haces, repite la conducta y celebra cada avance: con la práctica se vuelve natural.',
  'Es una fortaleza tuya. Sé ejemplo para tu equipo y comparte cómo llegaste ahí; también puedes ayudar a quien está en las primeras etapas.'
];

/* ---------- contenido: actividades ---------- */
const LV = {2:{cls:'ok',txt:'Muy alineada con el manual',mood:'happy',color:'green'},
            1:{cls:'mid',txt:'Parcialmente alineada',mood:'neutral',color:'peach'},
            0:{cls:'no',txt:'Poco alineada',mood:'sad',color:'beige'}};

const ACTS = {
 a1:{
  tab:'Actividad 1',
  title:'Paradigmas y semáforo del consciente',
  intro:'Vas a leer cuatro situaciones de trabajo. En cada una primero identificas en qué etapa del semáforo está la persona y luego decides qué harías tú. No existe una única respuesta perfecta: lo importante es que reflexiones por qué eliges lo que eliges.',
  topics:'Paradigmas, cambio de paradigmas y semáforo del consciente (páginas 5 a 7).',
  cases:[
   {title:'El favor de la tarjeta',color:'yellow',
    story:'Luis llega casi todos los días 20 minutos tarde y le pide a un compañero que marque su entrada como si hubiera llegado a tiempo. En su empleo anterior esto era normal y Luis cree, de verdad, que es solo un favor entre colegas que a nadie perjudica. Hoy te pide ese favor a ti.',

/* ---------- estado ---------- */
const S = {
  view:'quiz',
  quiz:{step:'intro',i:0,order:[],picks:[],stage:null},
  acts:{a1:{step:'intro',c:0,phase:'identify',data:[]},a2:{step:'intro',c:0,phase:'identify',data:[]}}
};

/* ---------- render base ---------- */
function renderTabs(){
  const items = [['quiz','Autoevaluación',S.quiz.step==='done'],['a1','Actividad 1',S.acts.a1.step==='done'],['a2','Actividad 2',S.acts.a2.step==='done']];
  $('#tabs').innerHTML = items.map(([id,label,done]) =>
    `<button class="tab" data-go="${id}" ${S.view===id?'aria-current="page"':''}>${label}${done?'<span class="done" aria-label="completada">✓</span>':''}</button>`).join('');
}
let first = true;
function render(focusSel){
  renderTabs();
  const m = $('#main');
  m.innerHTML = S.view==='quiz' ? viewQuiz() : viewAct(S.view);
  const f = focusSel ? $(focusSel) : $('[data-focus]');
  if(first){ first = false; return; }
  if(f) f.focus({preventScroll:!focusSel});
  if(!focusSel) m.scrollIntoView({block:'start'});
}

/* ---------- autoevaluación ---------- */
function viewQuiz(){
  const q = S.quiz;
  if(q.step==='intro') return `
    <section>
      <h1 data-focus tabindex="-1">Autoevaluación</h1>
      <p class="lead">Comprueba cuánto recuerdas de los temas vistos en el manual, desde el resumen introductorio hasta «Moral y ética, ¿son iguales?».</p>
      <ul class="facts">
        <li><strong>${QUIZ.length} preguntas</strong> de opción múltiple</li>
        <li><strong>Páginas 3 a 10</strong> del manual</li>
        <li><strong>Explicación inmediata</strong> después de cada respuesta</li>
      </ul>
      <p class="note">No es un examen: nadie te califica. Sirve para que veas qué temas dominas y cuáles conviene repasar.</p>
      <div class="row"><button class="btn" data-act="quiz-start">Comenzar autoevaluación</button></div>
    </section>`;
  if(q.step==='done') return quizResults();
  const Q = QUIZ[q.i], ord = q.order[q.i], pick = q.picks[q.i], answered = pick!==undefined, ok = answered && pick===Q.a;
  const pct = (q.i + (answered?1:0)) / QUIZ.length * 100;
  const mood = !answered ? 'neutral' : ok ? 'happy' : 'worried';
  const color = !answered ? 'lilac' : ok ? 'green' : 'pink';
  const opts = ord.map((oi,k) => {
    let cls = 'opt', mk = L[k];
    if(answered){
      cls += ' locked';
      if(oi===Q.a){cls+=' ok';mk='✓';}
      else if(oi===pick){cls+=' no';mk='✕';}
      else cls+=' dim';
    }
    return `<button class="${cls}" data-act="quiz-pick" data-k="${k}"><span class="mk">${mk}</span><span>${esc(Q.o[oi])}</span></button>`;
  }).join('');
  const fb = answered ? `
    <div class="fb ${ok?'ok':'no'}" id="fb" tabindex="-1" role="status">
      <p><strong>${ok?'Correcto.':'No es la respuesta.'}</strong>${ok?'':' La correcta es: '+esc(Q.o[Q.a])}</p>
      <p>${esc(Q.w)}</p>
      <p class="ref">Manual, página ${Q.p}</p>
    </div>
    <div class="row"><button class="btn" data-act="quiz-next">${q.i===QUIZ.length-1?'Ver resultados':'Siguiente pregunta'}</button></div>` : '';
  return `
    <section>
      <div class="top">
        <p class="meta">Pregunta ${q.i+1} de ${QUIZ.length}<br>${esc(TOPICS[Q.t].name)}</p>
        <div class="face ${answered?'pop':''}">${blob(color,mood,q.i,0)}</div>
      </div>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${QUIZ.length}" aria-valuenow="${q.i+(answered?1:0)}" aria-label="Avance"><span style="width:${pct}%"></span></div>
      <h2 data-focus tabindex="-1">${esc(Q.q)}</h2>
      <div>${opts}</div>
      ${fb}
    </section>`;
}
function quizResults(){
  const q = S.quiz; let score = 0; const by = {}; const missed = [];
  QUIZ.forEach((Q,i) => {
    by[Q.t] = by[Q.t] || {r:0,n:0}; by[Q.t].n++;
    if(q.picks[i]===Q.a){score++;by[Q.t].r++;} else missed.push(i);
  });
  const pct = Math.round(score/QUIZ.length*100);
  let title, msg, mood, color;
  if(score>=14){title='Dominas lo esencial';msg='Tienes claros los conceptos del manual. Ahora ponlos a prueba con los casos de las actividades.';mood='happy';color='green';}
  else if(score>=10){title='Vas por buen camino';msg='Entiendes la mayor parte. Repasa los temas marcados abajo antes de pasar a las actividades.';mood='neutral';color='yellow';}
  else{title='Vale la pena repasar';msg='Vuelve a leer las páginas indicadas y repite la autoevaluación cuando quieras. Nadie te califica.';mood='worried';color='pink';}
  const topics = Object.keys(TOPICS).filter(k => by[k]).map(k => {
    const b = by[k], p = b.r/b.n*100;
    return `<div class="topic">
      <div class="t"><span>${esc(TOPICS[k].name)}</span><span>${b.r} de ${b.n}</span></div>
      <div class="bar" role="img" aria-label="${b.r} de ${b.n} correctas"><span style="width:${p}%"></span></div>
      ${b.r<b.n?`<p class="hint">Repasa la${TOPICS[k].pages.includes('y')?'s páginas':' página'} ${TOPICS[k].pages} del manual.</p>`:''}
    </div>`;
  }).join('');
  const missedHTML = missed.length ? `
    <details><summary>Ver las ${missed.length} pregunta${missed.length>1?'s':''} que fallaste</summary>
      ${missed.map(i => { const Q = QUIZ[i];
        return `<div class="miss"><p><strong>${esc(Q.q)}</strong></p>
          <p>Tu respuesta: ${esc(Q.o[q.picks[i]])}</p>
          <p>Respuesta correcta: ${esc(Q.o[Q.a])}</p>
          <p>${esc(Q.w)} <em>(página ${Q.p})</em></p></div>`; }).join('')}
    </details>` : '';
  const stageBtns = STAGES.map((s,i) =>
    `<button class="opt stage s${i+1} ${q.stage===i?'picked':''}" data-act="stage" data-s="${i}" aria-pressed="${q.stage===i}"><span class="mk">${i+1}</span><span>${s}</span></button>`).join('');
  const tip = q.stage!==null ? `<div class="fb ok" role="status" id="tip" tabindex="-1"><p>${TIPS[q.stage]}</p></div>` : '<div role="status" id="tip"></div>';
  return `
    <section>
      <div class="score">
        <div class="face pop">${blob(color,mood,1,0)}</div>
        <div><p class="n">${score} de ${QUIZ.length}</p><p class="meta">${pct}% de respuestas correctas</p></div>
      </div>
      <h1 data-focus tabindex="-1">${title}</h1>
      <p class="lead">${msg}</p>
      <h2>Tu resultado por tema</h2>
      <div class="topics">${topics}</div>
      ${missedHTML}
      <hr class="sep">
      <h2>Tu semáforo personal</h2>
      <p class="note" style="margin-top:0">Piensa en un hábito de tu trabajo que te gustaría mejorar. ¿En qué etapa estás hoy?</p>
      <div class="stagebox">${stageBtns}</div>
      ${tip}
      <div class="row">
        <button class="btn" data-go="a1">Continuar con la Actividad 1</button>
        <button class="btn ghost" data-act="quiz-restart">Repetir la autoevaluación</button>
      </div>
    </section>`;
}

      <p class="lead">${esc(A.intro)}</p>
      <ul class="facts">
        <li><strong>${A.cases.length} casos</strong> con dos pasos cada uno: identificar y decidir</li>
        <li><strong>Temas:</strong> ${esc(A.topics)}</li>
        <li><strong>Reflexión opcional</strong> al final de cada caso, con un resumen que puedes copiar</li>
      </ul>
      <div class="row"><button class="btn" data-act="act-start" data-id="${id}">Comenzar actividad</button></div>
    </section>`;
  if(st.step==='done') return actSummary(id);
  const cs = A.cases[st.c], d = st.data[st.c];
  const decided = d.decPick!==null;
  const lvl = decided ? cs.d[d.decPick].l : null;
  const mood = decided ? LV[lvl].mood : 'neutral';
  const color = decided ? LV[lvl].color : cs.color;
  const pct = (st.c + (decided?1:0)) / A.cases.length * 100;
  let body = '';
  if(st.phase==='identify'){
    const answered = d.idPick!==null, ok = answered && d.idPick===cs.idA;
    const opts = d.idOrder.map((oi,k) => {
      let cls = 'opt' + (cs.keep && !answered ? ' stage s'+(oi+1) : ''), mk = cs.keep ? (oi+1) : L[k];
      if(answered){
        cls += ' locked';
        if(oi===cs.idA){cls+=' ok';mk='✓';} else if(oi===d.idPick){cls+=' no';mk='✕';} else cls+=' dim';
      }
      return `<button class="${cls}" data-act="act-id" data-k="${k}"><span class="mk">${mk}</span><span>${esc(cs.idO[oi])}</span></button>`;
    }).join('');
    body = `
      <h3>Paso 1: identifica</h3>
      <h2 data-focus tabindex="-1">${esc(cs.idQ)}</h2>
      <div>${opts}</div>
      ${answered?`
        <div class="fb ${ok?'ok':'no'}" id="fb" tabindex="-1" role="status">
          <p><strong>${ok?'Correcto.':'No es la respuesta.'}</strong>${ok?'':' La correcta es: '+esc(cs.idO[cs.idA])}</p>
          <p>${esc(cs.idW)}</p>
        </div>
        <div class="row"><button class="btn" data-act="act-to-decide">Ahora decide</button></div>`:''}`;
  } else {
    const idOk = d.idPick===cs.idA;
    const opts = d.decOrder.map((oi,k) => {
      const o = cs.d[oi]; let cls = 'opt', mk = L[k];
      if(decided){
        cls += ' locked';
        if(oi===d.decPick){cls += ' '+LV[o.l].cls; mk = o.l===2?'✓':o.l===1?'~':'✕';} else cls += ' dim';
      }
      return `<button class="${cls}" data-act="act-dec" data-k="${k}"><span class="mk">${mk}</span><span>${esc(o.t)}</span></button>`;
    }).join('');
    const chosen = decided ? cs.d[d.decPick] : null;
    const best = decided && chosen.l<2 ? cs.d.find(x=>x.l===2) : null;
    body = `
      <p class="recap">Tu diagnóstico: <strong>${esc(cs.idO[d.idPick])}</strong> ${idOk?'(correcto)':'(la respuesta correcta era «'+esc(cs.idO[cs.idA])+'»)'}</p>
      <h3>Paso 2: decide</h3>
      <h2 data-focus tabindex="-1">${esc(cs.dQ)}</h2>
      <div>${opts}</div>
      ${decided?`
        <div class="fb ${LV[lvl].cls}" id="fb" tabindex="-1" role="status">
          <p><strong>${LV[lvl].txt}.</strong> ${esc(chosen.f)}</p>
          ${best?`<p>Una respuesta muy alineada sería: «${esc(best.t)}»</p>`:''}
          <p>Idea del manual: ${esc(cs.lesson)}</p>
        </div>
        <label class="l" for="note">Reflexión opcional: ¿por qué elegiste esa opción?</label>
        <textarea id="note" data-note>${esc(d.note)}</textarea>
        <div class="row"><button class="btn" data-act="act-next">${st.c===A.cases.length-1?'Ver mi resumen':'Siguiente caso'}</button></div>`:''}`;
  }
  return `
    <section>
      <div class="top">
        <p class="meta">${esc(A.tab)}, caso ${st.c+1} de ${A.cases.length}<br>${esc(cs.title)}</p>
        <div class="face ${decided?'pop':''}">${blob(color,mood,st.c+1,0)}</div>
      </div>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${A.cases.length}" aria-valuenow="${st.c+(decided?1:0)}" aria-label="Avance"><span style="width:${pct}%"></span></div>
      <div class="story" style="border-left-color:${COL[cs.color]}"><p>${esc(cs.story)}</p></div>
      ${body}
    </section>`;
}
function actTotals(id){
  const A = ACTS[id], st = S.acts[id]; let idOk = 0, pts = 0;
  A.cases.forEach((cs,i) => { const d = st.data[i]; if(d.idPick===cs.idA) idOk++; pts += cs.d[d.decPick].l; });
  return {idOk, pts, max:A.cases.length*2};
}
function actSummary(id){
  const A = ACTS[id], st = S.acts[id], T = actTotals(id);
  const ratio = T.pts/T.max;
  const mood = ratio>=.75?'happy':ratio>=.5?'neutral':'worried';
  const color = ratio>=.75?'green':ratio>=.5?'yellow':'pink';
  const msg = ratio>=.75 ? 'Tus decisiones están muy alineadas con los principios del manual.' : ratio>=.5 ? 'Tomaste varias decisiones alineadas con el manual. Revisa las que quedaron parciales.' : 'Varias decisiones se alejaron del manual. Repasa las ideas de cada caso y vuelve a intentarlo.';
  const cases = A.cases.map((cs,i) => { const d = st.data[i], o = cs.d[d.decPick], ok = d.idPick===cs.idA;
    return `<div class="sumcase">
      <h3>${i+1}. ${esc(cs.title)}</h3>
      <p>Diagnóstico: ${esc(cs.idO[d.idPick])} ${ok?'(correcto)':'(correcto: '+esc(cs.idO[cs.idA])+')'}</p>
      <p>Tu decisión: ${esc(o.t)}</p>
      <p><span class="chip ${LV[o.l].cls}">${LV[o.l].txt}</span></p>
      ${d.note.trim()?`<p><em>Tu reflexión: ${esc(d.note.trim())}</em></p>`:''}
    </div>`; }).join('');
  const other = id==='a1' ? 'a2' : 'a1';
  const nextBtn = S.acts[other].step==='done'
    ? `<button class="btn ghost" data-go="quiz">Volver a la autoevaluación</button>`
    : `<button class="btn" data-go="${other}">Continuar con la ${ACTS[other].tab}</button>`;
  return `
    <section>
      <div class="score">
        <div class="face pop">${blob(color,mood,2,0)}</div>
        <div><p class="n">${T.pts} de ${T.max}</p><p class="meta">puntos de alineación con el manual<br>${T.idOk} de ${A.cases.length} diagnósticos correctos</p></div>
      </div>
      <h1 data-focus tabindex="-1">${esc(A.tab)} completada</h1>
      <p class="lead">${msg}</p>
      ${cases}
      <div class="row">
        <button class="btn" data-act="act-copy" data-id="${id}">Copiar mis respuestas</button>
        ${nextBtn}
        <button class="btn ghost" data-act="act-restart" data-id="${id}">Repetir la actividad</button>
      </div>
      <p class="note" id="copy-status" role="status"></p>
      <textarea id="copy-area" class="sr" aria-hidden="true" tabindex="-1" readonly></textarea>
    </section>`;
}
function summaryText(id){
  const A = ACTS[id], st = S.acts[id], T = actTotals(id);
  let t = `Manual Ético: ${A.tab}, ${A.title}\nDiagnósticos correctos: ${T.idOk} de ${A.cases.length}\nAlineación con el manual: ${T.pts} de ${T.max} puntos\n`;
  A.cases.forEach((cs,i) => { const d = st.data[i], o = cs.d[d.decPick];
    t += `\nCaso ${i+1}: ${cs.title}\n  Diagnóstico: ${cs.idO[d.idPick]} ${d.idPick===cs.idA?'(correcto)':'(correcto: '+cs.idO[cs.idA]+')'}\n  Decisión: ${o.t}\n  Resultado: ${LV[o.l].txt}\n`;
    if(d.note.trim()) t += `  Reflexión: ${d.note.trim()}\n`;
  });
  return t;
}

/* ---------- eventos ---------- */
document.addEventListener('click', e => {
  const go = e.target.closest('[data-go]');
  if(go){ S.view = go.dataset.go; render(); return; }
  const b = e.target.closest('[data-act]');
  if(!b) return;
  const act = b.dataset.act, q = S.quiz;
  if(act==='quiz-start'){
    q.step='q'; q.i=0; q.picks=[]; q.stage=null;
    q.order = QUIZ.map((Q,i) => Q.keep ? range(Q.o.length) : shuffle(range(Q.o.length)));
    render();
  } else if(act==='quiz-pick'){
    if(q.picks[q.i]!==undefined) return;
    q.picks[q.i] = q.order[q.i][+b.dataset.k];
    render('#fb');
  } else if(act==='quiz-next'){
    if(q.i===QUIZ.length-1) q.step='done'; else q.i++;
    render();
  } else if(act==='quiz-restart'){
    q.step='intro'; render();
  } else if(act==='stage'){
    q.stage = +b.dataset.s; render('#tip');
  } else if(act==='act-start' || act==='act-restart'){
    const id = b.dataset.id, A = ACTS[id];
    S.acts[id] = {step:'case',c:0,phase:'identify',data:A.cases.map(cs => ({
      idPick:null,decPick:null,note:'',
      idOrder: cs.keep ? range(cs.idO.length) : shuffle(range(cs.idO.length)),
      decOrder: shuffle(range(cs.d.length))
    }))};
    render();
  } else if(act==='act-id'){
    const st = S.acts[S.view], d = st.data[st.c];
    if(d.idPick!==null) return;
    d.idPick = d.idOrder[+b.dataset.k]; render('#fb');
  } else if(act==='act-to-decide'){
    S.acts[S.view].phase='decide'; render();
  } else if(act==='act-dec'){
    const st = S.acts[S.view], d = st.data[st.c];
    if(d.decPick!==null) return;
    d.decPick = d.decOrder[+b.dataset.k]; render('#fb');
  } else if(act==='act-next'){
    const id = S.view, st = S.acts[id];
    if(st.c===ACTS[id].cases.length-1) st.step='done'; else {st.c++; st.phase='identify';}
    render();
  } else if(act==='act-copy'){
    copySummary(b.dataset.id);
  }
});
document.addEventListener('input', e => {
  if(e.target.matches('[data-note]')){
    const st = S.acts[S.view]; st.data[st.c].note = e.target.value;
  }
});
async function copySummary(id){
  const text = summaryText(id), status = $('#copy-status');
  try{
    await navigator.clipboard.writeText(text);
    status.textContent = 'Copiado. Ya puedes pegarlo en un correo o documento.';
  }catch(err){
    try{
      const ta = $('#copy-area'); ta.value = text; ta.classList.remove('sr'); ta.removeAttribute('aria-hidden'); ta.removeAttribute('tabindex'); ta.style.minHeight='200px';
      ta.select(); const ok = document.execCommand('copy');
      status.textContent = ok ? 'Copiado. Ya puedes pegarlo en un correo o documento.' : 'No se pudo copiar automáticamente. Selecciona el texto de abajo y cópialo.';
    }catch(err2){
      status.textContent = 'No se pudo copiar automáticamente. Selecciona el texto de abajo y cópialo.';
    }
  }
}

render();
</script>
</body>
</html>
